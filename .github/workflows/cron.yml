name: Drain the job queue

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_URL   e.g. https://tiny-crm-xxxx.vercel.app   (no trailing slash)
#   CRON_SECRET   the same value set in Vercel's environment variables

# NOT SCHEDULED. The Vercel team hosting this project is on the Pro plan, whose
# cron supports minute-level schedules, so vercel.json drives the queue every 5
# minutes and this workflow would only duplicate it (harmlessly, but noisily —
# and it fails every run until STAGING_URL and CRON_SECRET are set).
#
# Kept as a manual fallback: run it from the Actions tab if Vercel Cron is
# unavailable, the plan changes, or you need an out-of-band drain.
on:
  workflow_dispatch:
    inputs:
      sweep:
        description: "Also run the retention sweep"
        type: boolean
        default: false

concurrency:
  # Never two drains at once. The queue tolerates it — claims use
  # FOR UPDATE SKIP LOCKED — but there is no reason to pay for the contention.
  group: cron-jobs
  cancel-in-progress: false

jobs:
  drain:
    name: Drain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the job endpoint
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SWEEP: ${{ inputs.sweep && '?sweep=1' || '' }}
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::STAGING_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # -sS: quiet but still report transport errors. The body is printed so
          # the run log shows what was processed; it contains counts only.
          response=$(mktemp)
          code=$(curl -sS -o "$response" -w '%{http_code}' \
                   --max-time 120 \
                   -H "Authorization: Bearer $CRON_SECRET" \
                   "${STAGING_URL}/api/cron/jobs${SWEEP}")

          echo "HTTP $code"
          cat "$response"
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Job endpoint returned $code."
            exit 1
          fi

          # A dead-lettered job is not a failed run — a poisoned job must never
          # block healthy work — but it does need a human, so surface it.
          if grep -q '"dead":[1-9]' "$response"; then
            echo "::warning::Dead-lettered jobs are waiting. Inspect with listDeadJobs()."
          fi

  sweep:
    name: Retention sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only when explicitly asked for; vercel.json runs the daily sweep.
    if: inputs.sweep
    steps:
      - name: Run the retention sweep
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::STAGING_URL and CRON_SECRET must both be set."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
                   -H "Authorization: Bearer $CRON_SECRET" \
                   "${STAGING_URL}/api/cron/jobs?sweep=1")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Sweep returned $code."; exit 1; }
