name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never the real one. The production gate refuses this value in production,
  # which is itself covered by tests/security/config.test.ts.
  AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks. Fast, and the ones most likely to fail, so they run first.
  # ---------------------------------------------------------------------------
  static:
    name: Types, lint, schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Prisma schema is valid
        run: npx prisma validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # The full suite on SQLite: unit, security, integration, portability.
  # ---------------------------------------------------------------------------
  test:
    name: Test suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # The same suite against real PostgreSQL, plus row-level security.
  #
  # This is the job that proves portability and the second isolation layer. The
  # RLS tests connect directly as the restricted role and issue the queries the
  # policies must survive — SELECT with no WHERE clause at all — so they need a
  # real server and a non-superuser login.
  # ---------------------------------------------------------------------------
  test-postgres:
    name: Test suite (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tinycrm
          POSTGRES_PASSWORD: tinycrm
          POSTGRES_DB: tinycrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tinycrm:tinycrm@localhost:5432/tinycrm_test
      RLS_APP_DATABASE_URL: postgresql://tinycrm_app:tinycrm_app@localhost:5432/tinycrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Switch the datasource to PostgreSQL
        run: node scripts/use-provider.mjs postgresql

      - run: npx prisma generate

      - name: Apply migrations
        # The PostgreSQL history is separate: Prisma locks a history to the
        # provider it was authored against, and prisma7.config.ts selects the
        # directory from DATABASE_URL.
        run: npx prisma migrate deploy

      - name: Apply the PostgreSQL-only SQL
        run: |
          node scripts/apply-sql.mjs prisma/postgres/001_search_indexes.sql
          node scripts/apply-sql.mjs prisma/postgres/002_row_level_security.sql
          node scripts/apply-sql.mjs prisma/postgres/003_deferrable_constraints.sql

      - name: Give the RLS-restricted role a login
        # The migration creates tinycrm_app with NOLOGIN and no password, on
        # purpose: a credential in a migration file is a credential in version
        # control. CI sets a throwaway one.
        run: |
          psql "$DATABASE_URL" -c "ALTER ROLE tinycrm_app WITH LOGIN PASSWORD 'tinycrm_app';"
          psql "$DATABASE_URL" -c "GRANT CONNECT ON DATABASE tinycrm_test TO tinycrm_app;"

      - name: Seed verification data
        run: npx tsx prisma/seed/test-seed.ts
        env:
          NODE_OPTIONS: --require ./scripts/allow-server-modules.cjs

      - name: Run every suite against PostgreSQL
        run: npx tsx --test --test-concurrency=1 "tests/**/*.test.ts"
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require ./scripts/allow-server-modules.cjs

      - name: Record the engine differences
        # Not a gate: the output is read when a portability question comes up.
        run: npx tsx scripts/db-differences.ts
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require ./scripts/allow-server-modules.cjs

      - name: Confirm the schema is unchanged by the provider switch
        run: |
          node scripts/use-provider.mjs sqlite
          git diff --exit-code prisma/schema.prisma

  # ---------------------------------------------------------------------------
  # Backup and restore, actually performed.
  # ---------------------------------------------------------------------------
  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tinycrm
          POSTGRES_PASSWORD: tinycrm
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Back up, destroy, restore, verify
        # Fails if row counts, the content fingerprint, referential integrity or
        # tenant isolation differ after the restore.
        run: npm run test:backup
        env:
          PGPORT: 5432

  # ---------------------------------------------------------------------------
  # Production build, the configuration gate in both directions, and the CSP.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./build.db

      - name: The production gate accepts a correct configuration
        run: npm run check:config
        env:
          NODE_ENV: production
          AUTH_SECRET: a-real-production-secret-of-sufficient-length-here
          DATABASE_URL: postgresql://user:pw@db.internal:5432/tinycrm
          APP_URL: https://app.example.com
          RATE_LIMIT_REDIS_URL: https://redis.example.com

      - name: The production gate refuses an unsafe configuration
        run: |
          if npm run check:config; then
            echo "::error::The gate accepted SQLite, demo auth, and an in-process limiter on 3 instances."
            exit 1
          fi
        env:
          NODE_ENV: production
          AUTH_SECRET: a-real-production-secret-of-sufficient-length-here
          DATABASE_URL: file:./dev.db
          APP_URL: http://localhost:3000
          ALLOW_DEMO_AUTH: "true"
          APP_INSTANCES: "3"

      - name: No package with an open advisory is loaded at runtime
        run: npm run audit:deps

  # ---------------------------------------------------------------------------
  # Performance budgets. A change that turns an indexed scan into a table scan
  # fails here rather than being discovered by a customer.
  # ---------------------------------------------------------------------------
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    # Seeding 25k contacts and 100k activities takes a couple of minutes; it
    # does not need to gate every push.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Query budgets at 25k contacts / 100k activities
        run: npm run test:perf

  # ---------------------------------------------------------------------------
  # Supply chain. A critical advisory in a runtime dependency blocks; everything
  # else is reported, because a transitive advisory in a build-time tool should
  # not stop a security fix from shipping.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fail on a critical advisory in runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Report everything else
        run: npm audit || true

  # ---------------------------------------------------------------------------
  # Secret scan. A committed credential is the one mistake a revert cannot fix.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
